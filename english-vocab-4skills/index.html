<style>
/* Layout: một cột dọc, thẻ xếp tầng như quyển sổ tay; thanh dưới cố định cho ngón tay bấm. */
:root{
  --ink:#16323c; --paper:#f6f2e9; --card:#fffdf8; --line:#ddd3c2;
  --teal:#0f6e68; --coral:#e0572e; --gold:#d79a24; --muted:#6b7b80;
  --good:#1f8a52; --bad:#c43b2e;
  --fd:'Baloo 2',"Segoe UI",system-ui,sans-serif;
  --fb:'Be Vietnam Pro',"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef2ef; --paper:#101b1f; --card:#17262b; --line:#2b3f46;
  --teal:#4fc9bd; --coral:#ff8a5f; --gold:#f0bf52; --muted:#9db0b5;
  --good:#5fd394; --bad:#ff8277; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#eef2ef; --paper:#101b1f; --card:#17262b; --line:#2b3f46;
  --teal:#4fc9bd; --coral:#ff8a5f; --gold:#f0bf52; --muted:#9db0b5;
  --good:#5fd394; --bad:#ff8277; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:1.45rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
.sub{color:var(--muted);font-size:.86rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 140px}
button{font-family:var(--fb);font-size:1rem;font-weight:600;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:12px 14px;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45}
.b-main{background:var(--teal);border-color:var(--teal);color:#fff}
.b-hot{background:var(--coral);border-color:var(--coral);color:#fff}
.b-wide{width:100%}
.b-sm{min-height:40px;padding:8px 12px;font-size:.9rem}
input[type=text],input[type=password]{font:inherit;width:100%;padding:12px;border-radius:12px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);transition:width .3s}
.kid{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px}
.ava{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);
  font-size:1.3rem;font-weight:800;color:#fff;flex:none}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;
  background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal);letter-spacing:.04em}
.pill.g{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.word{font-family:var(--fd);font-size:2.3rem;font-weight:800;line-height:1.1;word-break:break-word}
.vn{font-size:1.15rem;font-weight:600;color:var(--teal)}
.ex{font-size:.98rem;color:var(--ink);background:var(--paper);border-left:3px solid var(--gold);
  padding:10px 12px;border-radius:0 10px 10px 0}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--teal)}
.opt{width:100%;text-align:left;display:block}
.opt.ok{background:color-mix(in srgb,var(--good) 18%,var(--card));border-color:var(--good)}
.opt.no{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}
.nums{font-variant-numeric:tabular-nums}
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skb{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper)}
.skb b{font-family:var(--fd);font-size:1.5rem;display:block}
.meter{height:7px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.meter>i{display:block;height:100%}
.tag{display:inline-block;font-size:.82rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);
  background:var(--paper);margin:0 6px 6px 0}
.foot{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.foot button{flex:1}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.mono{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-word}
.note{font-size:.84rem;color:var(--muted)}
.mic{width:84px;height:84px;border-radius:99px;font-size:2rem;display:grid;place-items:center;margin:0 auto}
.mic.live{animation:p 1.1s infinite}
@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 0 12px color-mix(in srgb,var(--coral) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
</style>
</head><!--STRIP-->

const $ = s => document.querySelector(s);
const app = $('#app'), foot = $('#foot'), footin = $('#footin');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = t => String(t).toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const words = k => BANK[k.level];
const bank = k => BANK[k.level];
function migrate(o) {
  o.kids.forEach(k => {
    if (!Array.isArray(k.log)) {
      k.log = [];
      const b = BANK[k.level] || [];
      for (let d = 1; d <= (k.day || 0); d++) k.log.push({ t: 'seq', ws: b.slice((d - 1) * PERDAY, d * PERDAY).map(w => w[0]) });
    }
    if (k.cur && !k.cur.ws) k.cur = null;
    k.day = k.log.length;
  });
  if (!o.cfg) o.cfg = { token: '', chat: '', autosend: true };
  return o;
}
function learnedSet(k) { const s = new Set(); (k.log || []).forEach(e => e.ws.forEach(w => s.add(w))); return s; }
function entryOf(k, w) { return bank(k).find(x => x[0] === w); }
function topicAll(k, t) { return t === 'all' ? bank(k) : bank(k).filter(x => x[3] === t); }
function topicLeft(k, t, learned) { const s = learned || learnedSet(k); return topicAll(k, t).filter(x => !s.has(x[0])); }
const testDue = k => Math.floor(k.log.length / CYCLE) > k.tested;
const blockRange = k => [k.tested * CYCLE + 1, k.tested * CYCLE + CYCLE];
function blockLog(k) { return k.log.slice(k.tested * CYCLE, k.tested * CYCLE + CYCLE); }
function blockWords(k) {
  const out = [];
  blockLog(k).forEach(e => e.ws.forEach(w => { const x = entryOf(k, w); if (x) out.push(x); }));
  return out;
}
function blockTopics(k) {
  return Array.from(new Set(blockLog(k).map(e => TNAME[e.t] || TNAME.etc))).join(', ');
}
function dstr(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function sim(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const m = a.length, n = b.length, dp = Array.from({ length: m + 1 }, (_, i) => [i].concat(Array(n).fill(0)));
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - dp[m][n] / Math.max(m, n);
}

/* ---------- Đọc tiếng Anh (loa) ---------- */
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  voice = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = rate || .85; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Nghe micro (nói) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recordOnce(onDone, onState) {
  if (!SR) { onDone(null); return null; }
  let r;
  try { r = new SR(); } catch (e) { onDone(null); return null; }
  r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 3;
  let got = false;
  r.onresult = e => {
    got = true;
    const alts = [];
    for (let i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
    onDone(alts);
  };
  r.onerror = () => { if (!got) onDone(null); };
  r.onend = () => { onState && onState(false); if (!got) onDone(undefined); };
  try { r.start(); onState && onState(true); } catch (e) { onDone(null); }
  return r;
}

  const tot = bank(k).length, got = learnedSet(k).size, pct = Math.round(got / tot * 100);

    + '<div class="row"><div class="ava" style="background:' + k.color + '">' + esc(k.name.trim().charAt(0).toUpperCase() || '?') + '</div>'

    + '<div style="font-size:3rem">🎉</div><h1>Xong ' + n + ' từ hôm nay!</h1>'
    + '<div class="sub">' + esc(k.name) + ' đã học hết ngày ' + k.log.length + ' · chủ đề ' + esc(tp) + '.</div>'
    + (due ? '<div class="ex" style="text-align:left">Đủ 3 ngày rồi. Làm bài kiểm tra 4 kỹ năng cho ngày ' + a + '–' + b + ' nhé — bố mẹ sẽ nhận báo cáo.</div>' : '<div class="note">Còn ' + (CYCLE - k.day % CYCLE) + ' ngày nữa là tới bài kiểm tra.</div>')
    + '</div>';
  setFoot(due
    ? [{ txt: 'Về trang chủ', act: 'home' }, { txt: 'Kiểm tra ngay', act: 'test', cls: 'b-hot' }]
    : [{ txt: 'Về trang chủ', act: 'home', cls: 'b-main' }]);
  footin.querySelectorAll('button').forEach(b => b.dataset.k = k.id);
}

/* ---------- Soạn đề 4 kỹ năng ---------- */
function blank(w) {
  const re = new RegExp('\\b' + w[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  return re.test(w[2]) ? w[2].replace(re, '_____') : null;
}
function wrongs(pool, w, n, field) {
  return shuffle(pool.filter(x => x[0] !== w[0] && x[field] !== w[field])).slice(0, n);
}
function buildTest(k) {
  const pool = blockWords(k), per = 5, qs = [];
  const picks = s => shuffle(pool).slice(0, s);
  picks(per).forEach(w => {
    const opts = shuffle([w].concat(wrongs(pool, w, 3, 1))).map(x => x[1]);
    qs.push({ skill: 'listen', w, opts, ans: w[1] });
  });
  picks(per).forEach(w => qs.push({ skill: 'speak', w }));
  picks(per).forEach(w => {
    const b = blank(w);
    if (b) qs.push({ skill: 'read', w, text: b, opts: shuffle([w].concat(wrongs(pool, w, 3, 0))).map(x => x[0]), ans: w[0] });
    else qs.push({ skill: 'read', w, text: null, opts: shuffle([w].concat(wrongs(pool, w, 3, 1))).map(x => x[1]), ans: w[1] });
  });
  picks(per).forEach(w => qs.push({ skill: 'write', w }));
  return shuffle(qs);
}
const SKNAME = { listen: 'Nghe', speak: 'Nói', read: 'Đọc', write: 'Viết' };

/* ---------- Làm bài ---------- */
function vTest() {
  const t = view.t, k = kidById(view.kid);
  if (t.i >= t.qs.length) return gradeTest(k, t);
  const q = t.qs[t.i], pct = Math.round(t.i / t.qs.length * 100);
  let body = '';
  if (q.skill === 'listen') {
    body = '<div class="lbl">Nghe rồi chọn nghĩa đúng</div>'
      + '<button class="b-main b-wide" data-act="say" data-t="' + esc(q.w[0]) + '">🔊 Nghe lại từ</button>'
      + '<div class="stack">' + q.opts.map(o => '<button class="opt" data-act="ans" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  } else if (q.skill === 'read') {
    body = q.text
      ? '<div class="lbl">Đọc câu và chọn từ còn thiếu</div><div class="ex">' + esc(q.text) + '</div>'
      + '<div class="stack">' + q.opts.map(o => '<button class="opt" data-act="ans" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>'
      : '<div class="lbl">Từ này nghĩa là gì?</div><div class="word">' + esc(q.w[0]) + '</div>'
      + '<div class="stack">' + q.opts.map(o => '<button class="opt" data-act="ans" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  } else if (q.skill === 'write') {
    body = '<div class="lbl">Nghe và viết lại từ tiếng Anh</div>'
      + '<button class="b-main b-wide" data-act="say" data-t="' + esc(q.w[0]) + '">🔊 Nghe lại từ</button>'
      + '<div class="vn">' + esc(q.w[1]) + '</div>'
      + '<input type="text" id="wbox" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Viết từ tiếng Anh">'
      + '<button class="b-hot b-wide" data-act="answ">Kiểm tra</button>';
  } else {
    body = '<div class="lbl">Đọc to từ này</div><div class="word">' + esc(q.w[0]) + '</div>'
      + '<div class="vn">' + esc(q.w[1]) + '</div>'
      + '<button class="b-sm" data-act="say" data-t="' + esc(q.w[0]) + '">🔊 Nghe mẫu</button>'
      + '<button class="mic b-hot" data-act="mict" id="micbtn">🎤</button>'
      + '<div id="micmsg" class="note" style="text-align:center">' + (SR ? 'Bấm micro rồi đọc to.' : 'Thiết bị không nhận giọng nói — nghe mẫu, đọc to rồi tự chấm.') + '</div>'
      + (SR ? '' : '<div class="row"><button class="grow" data-act="selfno">Đọc chưa đúng</button><button class="b-main grow" data-act="selfok">Đọc đúng</button></div>');
  }
  app.innerHTML = '<div class="hdr"><div><div class="lbl">' + esc(k.name) + ' · kiểm tra ngày ' + t.a + '–' + t.b + '</div>'
    + '<h2 class="nums">Câu ' + (t.i + 1) + ' / ' + t.qs.length + ' · ' + SKNAME[q.skill] + '</h2></div>'
    + '<button class="b-sm" data-act="home">Thoát</button></div>'
    + '<div class="bar" style="margin-bottom:12px"><i style="width:' + pct + '%"></i></div>'
    + '<div class="card stack">' + body + '</div>'
    + '<div id="fb" class="stack" style="margin-top:12px"></div>';
  if (q.skill === 'listen' || q.skill === 'write') say(q.w[0]);
  if (q.skill === 'write') { const b = $('#wbox'); b.focus(); b.addEventListener('keydown', e => { if (e.key === 'Enter') handle('answ'); }); }
}
function mark(q, ok, said) {
  const t = view.t;
  t.score[q.skill] += ok ? 1 : 0;
  if (!ok) t.wrong.push(q.w[0] + ' (' + SKNAME[q.skill] + ')');
  app.querySelectorAll('[data-act="ans"],[data-act="answ"],[data-act="mict"],[data-act="selfok"],[data-act="selfno"]').forEach(b => b.disabled = true);
  app.querySelectorAll('[data-act="ans"]').forEach(b => {
    if (b.dataset.v === q.ans) b.classList.add('ok');
    else if (!ok && b.dataset.v === said) b.classList.add('no');
  });
  $('#fb').innerHTML = '<div class="card stack">'
    + '<h2 style="color:' + (ok ? 'var(--good)' : 'var(--bad)') + '">' + (ok ? '✓ Đúng rồi!' : '✗ Chưa đúng') + '</h2>'
    + '<div><b>' + esc(q.w[0]) + '</b> — ' + esc(q.w[1]) + '</div>'
    + (said ? '<div class="note">Em trả lời: ' + esc(said) + '</div>' : '')
    + '<div class="ex">' + esc(q.w[2]) + '</div>'
    + '<button class="b-main b-wide" data-act="nextq">' + (t.i + 1 === t.qs.length ? 'Xem kết quả' : 'Câu tiếp theo') + '</button></div>';
  $('#fb').scrollIntoView({ block: 'end', behavior: 'smooth' });
}
function gradeTest(k, t) {
  const total = Object.values(t.score).reduce((a, b) => a + b, 0), n = t.qs.length;
  const rec = {
    day: t.a + '–' + t.b, a: t.a, b: t.b, ts: Date.now(), score: t.score, n, topics: blockTopics(k),
    total, pct: Math.round(total / n * 100), wrong: t.wrong, words: blockWords(k).length
  };
  k.hist.push(rec); k.tested += 1; save();
  view = { name: 'result', kid: k.id, rec, sent: 'idle' };
  if (S.cfg.autosend && S.cfg.token && S.cfg.chat) sendReport(k, rec);
  render();
}

/* ---------- Kết quả + báo cáo ---------- */
function reportText(k, r) {
  const per = Object.keys(SKNAME).map(s => SKNAME[s] + ' ' + r.score[s] + '/5').join(' · ');
  return '📚 BÁO CÁO HỌC TỪ VỰNG\n'
    + '👦 ' + k.name + ' · ' + LVNAME[k.level] + '\n'
    + '🗓 ' + dstr(r.ts) + '\n'
    + '📖 Kiểm tra ngày ' + r.day + ' (' + r.words + ' từ đã học)\n'
    + (r.topics ? '🏷 Chủ đề: ' + r.topics + '\n' : '') + '\n'
    + per + '\n'
    + '➡️ Tổng: ' + r.total + '/' + r.n + ' = ' + r.pct + '% — ' + (r.pct >= PASS ? 'ĐẠT ✅' : 'CHƯA ĐẠT ⚠️') + '\n'
    + (r.wrong.length ? '\n❌ Cần học lại:\n• ' + r.wrong.join('\n• ') : '\n🌟 Không sai câu nào!');
}
function sendReport(k, r) {
  const c = S.cfg;
  if (!c.token || !c.chat) { view.sent = 'nocfg'; render(); return; }
  view.sent = 'sending'; render();
  fetch('https://api.telegram.org/bot' + c.token.trim() + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ chat_id: c.chat.trim(), text: reportText(k, r) })
  }).then(res => res.json()).then(j => { view.sent = j && j.ok ? 'ok' : 'fail'; render(); })
    .catch(() => { view.sent = 'fail'; render(); });
}
function vResult() {
  const k = kidById(view.kid), r = view.rec, pass = r.pct >= PASS;
  const msg = { idle: '', sending: 'Đang gửi báo cáo cho bố mẹ…', ok: '✅ Đã gửi báo cáo qua Telegram.', fail: '⚠️ Gửi Telegram không được (mạng chặn hoặc token sai). Anh copy báo cáo bên dưới gửi tay.', nocfg: 'Chưa cài bot Telegram — vào Cài đặt để nhập token và chat ID.' }[view.sent] || '';
  app.innerHTML = '<div class="hdr"><div><div class="lbl">' + esc(k.name) + ' · ngày ' + r.day + '</div>'
    + '<h1>' + (pass ? 'Đạt rồi!' : 'Cần ôn thêm') + '</h1></div>'
    + '<button class="b-sm" data-act="home">Trang chủ</button></div>'
    + '<div class="card stack">'
    + '<div class="row"><div class="word nums" style="color:' + (pass ? 'var(--good)' : 'var(--bad)') + '">' + r.pct + '%</div>'
    + '<div class="grow"><div class="nums">' + r.total + '/' + r.n + ' câu đúng</div><div class="sub">Mốc đạt: ' + PASS + '%</div></div></div>'
    + '<div class="sk">' + Object.keys(SKNAME).map(s => {
      const v = r.score[s], p = v / 5 * 100;
      return '<div class="skb"><div class="lbl">' + SKNAME[s] + '</div><b class="nums">' + v + '/5</b>'
        + '<div class="meter"><i style="width:' + p + '%;background:' + (p >= PASS ? 'var(--good)' : p >= 60 ? 'var(--gold)' : 'var(--bad)') + '"></i></div></div>';
    }).join('') + '</div>'
    + (r.wrong.length ? '<div><div class="lbl">Cần học lại</div>' + r.wrong.map(w => '<span class="tag">' + esc(w) + '</span>').join('') + '</div>' : '<div class="ex">Không sai câu nào. Tuyệt vời!</div>')
    + '</div>'
    + '<div class="card stack" style="margin-top:12px"><div class="lbl">Báo cáo cho bố mẹ</div>'
    + (msg ? '<div class="note">' + esc(msg) + '</div>' : '')
    + '<div class="mono" id="rep">' + esc(reportText(k, r)) + '</div>'
    + '<div class="row"><button class="grow b-sm" data-act="copy">Copy báo cáo</button>'
    + '<button class="grow b-sm b-main" data-act="resend">Gửi Telegram</button></div></div>';
  setFoot([{ txt: 'Về trang chủ', act: 'home', cls: 'b-main' }]);
}

/* ---------- Lịch sử ---------- */
function vHist() {
  const k = kidById(view.kid);
  app.innerHTML = '<div class="hdr"><div><div class="lbl">' + esc(k.name) + '</div><h1>Lịch sử kiểm tra</h1></div>'
    + '<button class="b-sm" data-act="home">Trang chủ</button></div>'
    + '<div class="card">' + (k.hist.length ? k.hist.slice().reverse().map(r =>
      '<div class="hist"><div><b>Ngày ' + r.day + '</b><div class="sub nums">' + dstr(r.ts) + '</div>'
      + '<div class="sub">' + Object.keys(SKNAME).map(s => SKNAME[s] + ' ' + r.score[s]).join(' · ') + '</div>'
      + (r.topics ? '<div class="sub">' + esc(r.topics) + '</div>' : '') + '</div>'
      + '<div style="text-align:right"><b class="nums" style="font-size:1.3rem;color:' + (r.pct >= PASS ? 'var(--good)' : 'var(--bad)') + '">' + r.pct + '%</b>'
      + '<div class="sub nums">' + r.total + '/' + r.n + '</div></div></div>').join('')
      : '<div class="note">Chưa có bài kiểm tra nào.</div>') + '</div>';
  setFoot([{ txt: 'Về trang chủ', act: 'home', cls: 'b-main' }]);
}

/* ---------- Cài đặt ---------- */
function vCfg() {
  app.innerHTML = '<div class="hdr"><div><h1>Cài đặt</h1><div class="sub">Tên con, trình độ và bot Telegram của bố mẹ</div></div>'
    + '<button class="b-sm" data-act="home">Xong</button></div>'
    + '<div class="stack">'
    + S.kids.map(k => '<div class="card stack"><div class="lbl">Hồ sơ ' + esc(k.id) + '</div>'
      + '<input type="text" id="n_' + k.id + '" value="' + esc(k.name) + '" placeholder="Tên con">'
      + '<div class="row"><button class="grow ' + (k.level === 'movers' ? 'b-main' : '') + '" data-act="lv" data-k="' + k.id + '" data-v="movers">Movers (A1)</button>'
      + '<button class="grow ' + (k.level === 'b1' ? 'b-main' : '') + '" data-act="lv" data-k="' + k.id + '" data-v="b1">B1 (PET)</button></div>'
      + '<div class="note nums">Đã học ' + learnedSet(k).size + '/' + bank(k).length + ' từ · ' + k.log.length + ' ngày · ' + k.hist.length + ' bài kiểm tra</div>'
      + '<button class="b-sm" data-act="reset" data-k="' + k.id + '">Xóa tiến độ hồ sơ này</button></div>').join('')
    + '<div class="card stack"><div class="lbl">Telegram báo cáo</div>'
    + '<div class="note">Lấy token từ @BotFather, lấy chat ID bằng cách nhắn cho bot rồi mở api.telegram.org/bot&lt;token&gt;/getUpdates.</div>'
    + '<input type="text" id="tk" value="' + esc(S.cfg.token) + '" placeholder="Bot token">'
    + '<input type="text" id="ch" value="' + esc(S.cfg.chat) + '" placeholder="Chat ID của bố mẹ">'
    + '<div class="row"><button class="grow ' + (S.cfg.autosend ? 'b-main' : '') + '" data-act="auto">Tự gửi sau mỗi bài: ' + (S.cfg.autosend ? 'BẬT' : 'TẮT') + '</button></div>'
    + '<button class="b-sm" data-act="testtg">Gửi tin thử</button>'
    + '<div id="tgmsg" class="note"></div></div>'
    + '</div>';
  setFoot([{ txt: 'Lưu cài đặt', act: 'savecfg', cls: 'b-main' }]);
}
function readCfg() {
  S.kids.forEach(k => { const el = $('#n_' + k.id); if (el && el.value.trim()) k.name = el.value.trim(); });
  const t = $('#tk'), c = $('#ch');
  if (t) S.cfg.token = t.value.trim();
  if (c) S.cfg.chat = c.value.trim();
  save();
}

/* ---------- Xử lý bấm ---------- */
let rec = null;
function handle(act, el) {
  const kid = el && el.dataset.k ? kidById(el.dataset.k) : kidById(view.kid);
  if (act === 'home') { if (view.name === 'cfg') readCfg(); go('home'); return; }
  if (act === 'cfg') { go('cfg'); return; }
  if (act === 'hist') { go('hist', { kid: kid.id }); return; }
  if (act === 'say') { say(el.dataset.t, el.dataset.r ? parseFloat(el.dataset.r) : .85); return; }

  if (act === 'topics') { go('topics', { kid: kid.id }); return; }
  if (act === 'resume') { go('learn', { kid: kid.id }); return; }
  if (act === 'pick') {
    const t = el.dataset.t, left = topicLeft(kid, t);
    if (!left.length) return;
    kid.cur = { t, ws: left.slice(0, PERDAY).map(w => w[0]), idx: 0 };
    save(); go('learn', { kid: kid.id }); return;
  }
  if (act === 'next') { const k = kidById(view.kid); k.cur.idx++; save(); render(); return; }
  if (act === 'mic') {
    const msg = $('#micmsg'), btn = $('#micbtn'), target = el.dataset.t;
    if (!SR) { msg.textContent = 'Thiết bị này không nhận giọng nói. Nghe mẫu rồi đọc to theo nhé.'; return; }
    msg.textContent = 'Đang nghe… đọc to từ đi!'; btn.classList.add('live');
    rec = recordOnce(alts => {
      btn.classList.remove('live');
      if (!alts) { msg.textContent = 'Không nghe được. Thử lại và nói to hơn.'; return; }
      const best = Math.max.apply(null, alts.map(a => sim(a, target)));
      msg.innerHTML = best >= .75
        ? '<b style="color:var(--good)">✓ Đọc tốt lắm! (' + Math.round(best * 100) + '%)</b>'
        : '<b style="color:var(--bad)">Nghe ra "' + esc(alts[0]) + '" — thử lại nhé</b>';
    }, on => { if (!on) btn.classList.remove('live'); });
    return;
  }

  if (act === 'test') {
    const [a, b] = blockRange(kid);
    const qs = buildTest(kid);
    go('test', { kid: kid.id, t: { qs, i: 0, a, b, score: { listen: 0, speak: 0, read: 0, write: 0 }, wrong: [] } });
    return;
  }
  if (act === 'ans') {
    const q = view.t.qs[view.t.i];
    mark(q, el.dataset.v === q.ans, el.dataset.v); return;
  }
  if (act === 'answ') {
    const q = view.t.qs[view.t.i], v = ($('#wbox') || {}).value || '';
    if (!v.trim()) { $('#wbox').focus(); return; }
    mark(q, norm(v) === norm(q.w[0]), v.trim()); return;
  }
  if (act === 'mict') {
    const q = view.t.qs[view.t.i], msg = $('#micmsg'), btn = $('#micbtn');
    msg.textContent = 'Đang nghe… đọc to từ đi!'; btn.classList.add('live');
    rec = recordOnce(alts => {
      btn.classList.remove('live');
      if (!alts) {
        msg.innerHTML = 'Không nhận được giọng. <b>Tự chấm:</b>';
        msg.insertAdjacentHTML('afterend', '<div class="row"><button class="grow" data-act="selfno">Đọc chưa đúng</button><button class="b-main grow" data-act="selfok">Đọc đúng</button></div>');
        return;
      }
      const best = Math.max.apply(null, alts.map(a => sim(a, q.w[0])));
      mark(q, best >= .75, alts[0] + ' (' + Math.round(best * 100) + '%)');
    });
    return;
  }
  if (act === 'selfok' || act === 'selfno') { mark(view.t.qs[view.t.i], act === 'selfok', 'tự chấm'); return; }
  if (act === 'nextq') { view.t.i++; render(); return; }

  if (act === 'copy') {
    const txt = reportText(kidById(view.kid), view.rec);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => { el.textContent = 'Đã copy ✓'; }).catch(() => selectRep());
    } else selectRep();
    return;
  }
  if (act === 'resend') { sendReport(kidById(view.kid), view.rec); return; }

  if (act === 'lv') { kid.level = el.dataset.v; kid.log = []; kid.day = 0; kid.tested = 0; kid.cur = null; kid.hist = []; readCfg(); render(); return; }
  if (act === 'auto') { readCfg(); S.cfg.autosend = !S.cfg.autosend; save(); render(); return; }
  if (act === 'reset') {
    if (el.dataset.sure) {
      const i = S.kids.findIndex(x => x.id === kid.id);
      S.kids[i] = freshKid(kid.id, kid.name, kid.level, kid.color); save(); render();
    } else { el.dataset.sure = '1'; el.textContent = 'Bấm lần nữa để xóa thật'; el.classList.add('b-hot'); }
    return;
  }
  if (act === 'savecfg') { readCfg(); go('home'); return; }
  if (act === 'testtg') {
    readCfg();
    const m = $('#tgmsg');
    if (!S.cfg.token || !S.cfg.chat) { m.textContent = 'Nhập token và chat ID trước đã.'; return; }
    m.textContent = 'Đang gửi…';
    fetch('https://api.telegram.org/bot' + S.cfg.token + '/sendMessage', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ chat_id: S.cfg.chat, text: 'Sổ Từ Mỗi Ngày: kết nối thành công. Bố mẹ sẽ nhận báo cáo ở đây.' })
    }).then(r => r.json()).then(j => { m.textContent = j && j.ok ? '✅ Gửi được rồi.' : '⚠️ Lỗi: ' + ((j && j.description) || 'không rõ'); })
      .catch(() => { m.textContent = '⚠️ Không gọi được Telegram. Nếu đang xem trong khung preview thì phải mở app sau khi deploy.'; });
    return;
  }
}
function selectRep() {
  const n = $('#rep'), r = document.createRange(); r.selectNodeContents(n);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

render();
</script>
